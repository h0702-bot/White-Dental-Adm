<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة – White Dental Clinic</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ac:#9EA8B1;--tx:#303030;--alt:#EBEBEB;--mu:#5d6670;--bd:rgba(48,48,48,.13);--r:14px}
*{box-sizing:border-box;margin:0}body{font:400 15px/1.6 Tajawal,system-ui,sans-serif;color:var(--tx);background:var(--alt)}
[hidden]{display:none!important}button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bt{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13.5px;transition:.2s}.bt:hover{border-color:var(--ac)}
.bt.p{background:var(--tx);color:#fff;border-color:var(--tx)}.bt.d{color:#a23d33}.bt:disabled{opacity:.5;cursor:wait}
input,select{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-width:0}input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(158,168,177,.35)}
#lg{min-height:100vh;display:grid;place-items:center;padding:20px}
.cd{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(48,48,48,.08)}
#lg .cd{width:min(400px,100%);display:grid;gap:14px}#lg img{width:200px;margin:0 auto}#lg h1{font-size:1.2rem;text-align:center}#lg label{display:grid;gap:5px;font-size:13.5px}
.er{color:#a23d33;font-size:13.5px;min-height:20px}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#fff;border-inline-end:1px solid var(--bd);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside img{width:170px;margin:0 auto 18px;display:block}
.nv{border:0;background:none;text-align:start;padding:11px 14px;border-radius:12px;cursor:pointer;color:var(--mu);font-weight:500}.nv.on{background:var(--alt);color:var(--tx)}
#who{margin-top:auto;font-size:12.5px;color:var(--mu);word-break:break-all;padding:0 6px}
main{padding:28px;min-width:0}h2{font-size:1.5rem;margin-bottom:16px}h3{font-size:1.05rem;margin:26px 0 10px}
#st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.sc{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:18px;text-align:start;cursor:pointer;display:grid;transition:.2s}.sc:hover{border-color:var(--ac);transform:translateY(-2px)}.sc b{font-size:2rem;line-height:1.2}.sc span{color:var(--mu);font-size:13.5px}
.tb{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}.tb input[type=search]{flex:1;min-width:200px}
.tw{background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12.5px;color:var(--mu);font-weight:500;background:#fafafa}tr:last-child td{border:0}
td small{display:block;color:var(--mu)}.ac{display:flex;gap:6px}.ph{direction:ltr;unicode-bidi:embed;display:inline-block}
.b{padding:2px 11px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--alt)}.b.new{background:var(--ac);color:#1d1d1d}.b.confirmed{background:#dbe9e0;color:#2f5b43}.b.rejected{background:#f3dcd9;color:#8c3128}.b.completed{background:var(--tx);color:#fff}
.em{padding:34px;text-align:center;color:var(--mu)}
#ld,#err{padding:16px;border-radius:12px;background:#fff;border:1px solid var(--bd);margin-bottom:14px}#err{color:#a23d33;display:flex;gap:12px;align-items:center;justify-content:space-between}
dialog{border:0;border-radius:20px;padding:26px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(48,48,48,.5)}
dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:14px 0 20px}dt{color:var(--mu)}dd{margin:0;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap}
#ts{position:fixed;inset:auto 0 22px;margin:auto;width:max-content;max-width:90vw;background:var(--tx);color:#fff;padding:11px 20px;border-radius:99px;opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none;z-index:9}#ts.show{opacity:1;transform:none}#ts.bad{background:#a23d33}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}aside img{width:110px;margin:0}#who{display:none}.nv{padding:8px 12px}main{padding:16px}.hm{display:none}}
</style>
</head>
<body>
<div id="lg"><form class="cd" id="lf"><img alt="White Dental Clinic" data-lg><h1>تسجيل دخول الإدارة</h1>
<div class="er" id="cfg" hidden>لم يتم ربط Supabase بعد: عدّل SUPABASE_URL و SUPABASE_ANON_KEY في أعلى السكريبت.</div>
<label>البريد الإلكتروني<input type="email" id="em" required autocomplete="username"></label>
<label>كلمة المرور<input type="password" id="pw" required autocomplete="current-password"></label>
<div class="er" id="le" role="alert"></div><button class="bt p" id="lb" style="padding:11px">دخول</button></form></div>

<div id="app" hidden>
<aside><img alt="White Dental Clinic" data-lg>
<button class="nv on" data-v="dash">الرئيسية</button><button class="nv" data-v="list">المواعيد</button>
<span id="who"></span><button class="bt" id="lo">تسجيل الخروج</button></aside>
<main>
<div id="ld">جارٍ التحميل…</div>
<div id="err" hidden><span></span><button class="bt" id="rt">إعادة المحاولة</button></div>
<section id="v-dash"><h2>نظرة عامة</h2><div id="st"></div><h3>أحدث الطلبات الجديدة</h3><div class="tw" id="rc"></div></section>
<section id="v-list" hidden><h2>طلبات المواعيد <small id="cnt" style="color:var(--mu)"></small></h2>
<div class="tb"><input type="search" id="q" placeholder="بحث بالاسم أو رقم الهاتف"><select id="fst"><option value="">كل الحالات</option><option value="new">جديد</option><option value="confirmed">مؤكد</option><option value="rejected">مرفوض</option><option value="completed">مكتمل</option></select><input type="date" id="fd" title="تاريخ الموعد"><button class="bt" id="rf">تحديث</button></div>
<div class="tw" id="al"></div></section>
</main></div>

<dialog id="dt"></dialog>
<dialog id="cf"><h3 style="margin:0 0 8px">حذف الموعد؟</h3><p id="cft" style="color:var(--mu)"></p><div class="row" style="margin-top:20px"><button class="bt d" id="cfy">نعم، احذف</button><button class="bt" id="cfn">إلغاء</button></div></dialog>
<div id="ts" role="status" aria-live="polite"></div>

const READY=!SUPABASE_URL.includes("YOUR-PROJECT")&&!SUPABASE_ANON_KEY.includes("YOUR-ANON");
const sb=READY?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const ST={new:"جديد",confirmed:"مؤكد",rejected:"مرفوض",completed:"مكتمل"};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fD=d=>d?d.split("-").reverse().join("/"):"",fT=t=>(t||"").slice(0,5),fDT=s=>new Date(s).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
const msg=e=>navigator.onLine?(e&&e.message)||"حدث خطأ غير متوقع":"لا يوجد اتصال بالإنترنت";
let rows=[],delId=null;
document.querySelectorAll("[data-lg]").forEach(i=>i.src=LOGO);
function toast(m,bad){const t=$("#ts");t.textContent=m;t.className="show"+(bad?" bad":"");clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",3600)}
function view(v){["dash","list"].forEach(x=>$("#v-"+x).hidden=x!=v);document.querySelectorAll(".nv").forEach(b=>b.classList.toggle("on",b.dataset.v==v))}
function showLogin(m){$("#app").hidden=true;$("#lg").hidden=false;$("#le").textContent=m||"";rows=[]}
async function gate(u){const{data,error}=await sb.from("admins").select("user_id").eq("user_id",u.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();showLogin(error?msg(error):"هذا الحساب غير مخوّل للدخول إلى لوحة الإدارة.");return}
 $("#lg").hidden=true;$("#app").hidden=false;$("#who").textContent=u.email;load()}
async function load(){$("#ld").hidden=false;$("#err").hidden=true;$("#rf").disabled=true;
 const{data,error}=await sb.from("appointments").select("*").order("created_at",{ascending:false}).limit(1000);
 $("#ld").hidden=true;$("#rf").disabled=false;
 if(error){$("#err").hidden=false;$("#err span").textContent="تعذر تحميل المواعيد: "+msg(error);return}
 rows=data;draw()}
function tbl(l,empty){if(!l.length)return`<p class="em">${empty}</p>`;
 return`<table><thead><tr><th>المريض</th><th>الهاتف</th><th>الموعد</th><th class="hm">الخدمة</th><th>الحالة</th><th></th></tr></thead><tbody>`+l.map(r=>`<tr><td><b>${esc(r.full_name)}</b><small>${fDT(r.created_at)}</small></td><td><span class="ph">${esc(r.phone)}</span></td><td>${fD(r.preferred_date)}<small>${fT(r.preferred_time)}</small></td><td class="hm">${esc(r.service)}</td><td><span class="b ${r.status}">${ST[r.status]||esc(r.status)}</span></td><td><div class="ac"><button class="bt" data-act="view" data-id="${r.id}">تفاصيل</button>${r.status=="new"||r.status=="rejected"?`<button class="bt p" data-act="confirmed" data-id="${r.id}">تأكيد</button>`:""}${r.status=="new"||r.status=="confirmed"?`<button class="bt d" data-act="rejected" data-id="${r.id}">رفض</button>`:""}</div></td></tr>`).join("")+"</tbody></table>"}
function draw(){const c=s=>rows.filter(r=>r.status==s).length;
 $("#st").innerHTML=[["","الإجمالي",rows.length],["new","جديدة",c("new")],["confirmed","مؤكدة",c("confirmed")],["rejected","مرفوضة",c("rejected")],["completed","مكتملة",c("completed")]].map(([k,l,n])=>`<button class="sc" data-go="${k}"><b>${n}</b><span>${l}</span></button>`).join("");
 $("#rc").innerHTML=tbl(rows.filter(r=>r.status=="new").slice(0,5),"لا توجد طلبات جديدة.");
 const q=$("#q").value.trim().toLowerCase(),qd=q.replace(/\D/g,""),s=$("#fst").value,d=$("#fd").value;
 const f=rows.filter(r=>(!s||r.status==s)&&(!d||r.preferred_date==d)&&(!q||r.full_name.toLowerCase().includes(q)||(qd&&r.phone.replace(/\D/g,"").includes(qd))));
 $("#al").innerHTML=tbl(f,rows.length?"لا توجد نتائج مطابقة.":"لا توجد مواعيد بعد. ستظهر هنا طلبات الحجز القادمة من الموقع.");$("#cnt").textContent="("+f.length+")"}
function detail(id){const r=rows.find(x=>x.id==id);if(!r)return;
 const L={fr:"الفرنسية",ar:"العربية",en:"الإنجليزية"};
 $("#dt").innerHTML=`<h3 style="margin:0">${esc(r.full_name)} <span class="b ${r.status}">${ST[r.status]||esc(r.status)}</span></h3><dl>
 <dt>الهاتف</dt><dd><a class="ph" href="tel:${esc(r.phone)}">${esc(r.phone)}</a></dd><dt>البريد</dt><dd>${r.email?`<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:"—"}</dd>
 <dt>التاريخ</dt><dd>${fD(r.preferred_date)}</dd><dt>الوقت</dt><dd>${fT(r.preferred_time)}</dd><dt>الخدمة</dt><dd>${esc(r.service)}</dd>
 <dt>الرسالة</dt><dd>${esc(r.message)||"—"}</dd><dt>لغة الزائر</dt><dd>${L[r.lang]||"—"}</dd><dt>تاريخ الطلب</dt><dd>${fDT(r.created_at)}</dd></dl>
 <div class="row">${["confirmed","rejected","completed","new"].filter(s=>s!=r.status).map(s=>`<button class="bt ${s=="confirmed"?"p":""}" data-act="${s}" data-id="${r.id}">${{confirmed:"تأكيد",rejected:"رفض",completed:"تم الإنجاز",new:"إعادة إلى جديد"}[s]}</button>`).join("")}<button class="bt d" data-act="del" data-id="${r.id}">حذف</button><button class="bt" data-act="close">إغلاق</button></div>`;
 $("#dt").showModal()}
async function setStatus(id,s){const{data,error}=await sb.from("appointments").update({status:s,status_updated_at:new Date().toISOString()}).eq("id",id).select();
 if(error||!data.length){toast(error?msg(error):"تعذر التحديث: تحقق من صلاحيات الإدارة (جدول admins).",1);return}
 rows=rows.map(r=>r.id==id?data[0]:r);$("#dt").close();draw();toast("تم تحديث الحالة إلى: "+ST[s])}
async function del(){const id=delId;$("#cfy").disabled=true;
 const{data,error}=await sb.from("appointments").delete().eq("id",id).select();$("#cfy").disabled=false;
 if(error||!data.length){toast(error?msg(error):"تعذر الحذف: تحقق من صلاحيات الإدارة.",1);return}
 rows=rows.filter(r=>r.id!=id);$("#cf").close();$("#dt").close();draw();toast("تم حذف الموعد")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act],[data-go],[data-v]");if(!b)return;const d=b.dataset;
 if(d.v)view(d.v);else if(d.go!==undefined){$("#fst").value=d.go;$("#q").value="";$("#fd").value="";view("list");draw()}
 else if(d.act=="view")detail(d.id);else if(d.act=="close")$("#dt").close();
 else if(d.act=="del"){const r=rows.find(x=>x.id==d.id);delId=d.id;$("#cft").textContent="سيتم حذف موعد "+r.full_name+" نهائيًا ولا يمكن التراجع.";$("#cf").showModal()}
 else setStatus(d.id,d.act)});
["q","fst","fd"].forEach(i=>$("#"+i).addEventListener("input",draw));
$("#rf").onclick=$("#rt").onclick=load;$("#cfy").onclick=del;$("#cfn").onclick=()=>$("#cf").close();
$("#lo").onclick=async()=>{await sb.auth.signOut();showLogin()};
$("#lf").addEventListener("submit",async e=>{e.preventDefault();if(!READY){$("#le").textContent="أدخل بيانات Supabase أولًا.";return}
 $("#lb").disabled=true;$("#le").textContent="";
 const{data,error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});$("#lb").disabled=false;
 if(error){$("#le").textContent=navigator.onLine?"البريد أو كلمة المرور غير صحيحة.":msg();return}
 $("#pw").value="";gate(data.user)});
if(!READY)$("#cfg").hidden=false;else{sb.auth.getSession().then(({data})=>{if(data.session)gate(data.session.user)});sb.auth.onAuthStateChange(ev=>{if(ev=="SIGNED_OUT")showLogin()})}
</script>
</body>
</html>
